name: "local"

services:

  mongo:
    image: mongo:8
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: pochka
      MONGO_INITDB_ROOT_PASSWORD: tapochka
    volumes:
      - ./mongo_data:/data/db

  # Admin panel (optional)
  mongo-express:
    image: mongo-express
    restart: always
    depends_on:
      - mongo
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: pochka
      ME_CONFIG_MONGODB_ADMINPASSWORD: tapochka
      ME_CONFIG_MONGODB_URL: mongodb://pochka:tapochka@mongo:27017/
      ME_CONFIG_BASICAUTH: false

  postgres:
    # https://hub.docker.com/_/postgres
    image: "postgres:15"
    restart: "always"
    shm_size: "128mb"
    ports:
      - "5432:5432"
    volumes:
      - "postgres:/var/lib/postgresql/data/:rw"
    environment:
      POSTGRES_PASSWORD: "test"
      POSTGRES_USER: "pochka"
      POSTGRES_DB: "tapochka"

volumes:
  postgres:
