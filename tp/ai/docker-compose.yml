services:
  ollama:
    image: ollama/ollama:0.7.0
    container_name: ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ./ollama:/root/.ollama

  open-webui:
    image: ghcr.io/open-webui/open-webui:0.6.10
    container_name: open-webui
    restart: always
    depends_on:
      - ollama
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "3001:8080"
    volumes:
      - ./open-webui:/app/backend/data
